[project]
name = "reportify"
version = "0.1.0"
description = "AI data analysis and visualization agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "cryptography>=50.0.2",
    "fastapi>=0.115,<1",
    "pandas>=3.1.1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8,<9",
    "pytest-asyncio>=1",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reportify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
