services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reportify
      POSTGRES_PASSWORD: reportify
      POSTGRES_DB: reportify
    ports:
      - "127.0.0.1:${REPORTIFY_PG_PORT:-5432}:5432"
    volumes:
      - reportify_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportify -d reportify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REPORTIFY_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reportify_pg:
