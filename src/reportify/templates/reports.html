{% extends "layout.html" %}
{% block content %}
<section class="card">
  <div class="card-head">
    <h2>报告</h2>
    <button id="refresh" class="btn">刷新</button>
  </div>
  <table class="table">
    <thead><tr><th>标题</th><th>状态</th><th>渲染器</th><th>快照</th><th>生成时间</th><th></th></tr></thead>
    <tbody id="report-rows"></tbody>
  </table>
</section>
<section class="card">
  <h2>Lineage</h2>
  <pre id="report-lineage" class="code">选择一份报告查看数据来源。</pre>
</section>
{% endblock %}
