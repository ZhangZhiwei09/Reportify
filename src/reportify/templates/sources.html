{% extends "layout.html" %}
{% block content %}
<section class="grid two">
  <div class="card">
    <div class="card-head"><h2>数据源</h2><button id="refresh" class="btn">刷新</button></div>
    <ul id="source-list" class="list"></ul>
  </div>
  <div class="card">
    <div class="card-head"><h2>新增 PostgreSQL 数据源</h2></div>
    <form id="source-form" class="form">
      <label>名称<input name="name" required placeholder="analytics_db"></label>
      <label>主机<input name="host" required value="127.0.0.1"></label>
      <label>端口<input name="port" type="number" value="5432" required></label>
      <label>数据库<input name="database" required></label>
      <label>用户名<input name="username" required></label>
      <label>密码<input name="password" type="password" required></label>
      <label>Schema 白名单<input name="schema" value="public"></label>
      <button class="btn primary" type="submit">保存</button>
    </form>
  </div>
</section>
<section class="card">
  <div class="card-head"><h2>表</h2><span id="source-hint" class="meta">先选择数据源</span></div>
  <ul id="table-list" class="list"></ul>
</section>
{% endblock %}
