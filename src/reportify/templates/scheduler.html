{% extends "layout.html" %}
{% block content %}
<section class="card">
  <h2>新建定时任务</h2>
  <p class="notice">
    定时任务重复执行一个已有分析任务，触发时新建 Run（<code>trigger=scheduled</code>）。
    无人值守运行不会请求工具审批：需审批的工具会被隐藏并在执行计划中注明。
  </p>
  <form id="schedule-form" class="form">
    <label>任务 ID
      <input id="schedule-task" name="task_id" placeholder="analysis_task 的 UUID" required>
    </label>
    <label>Cron（分 时 日 月 周）
      <input id="schedule-cron" name="cron" value="0 9 * * *" required>
    </label>
    <label>时区
      <input id="schedule-tz" name="timezone" value="Asia/Shanghai">
    </label>
    <div><button class="btn primary" type="submit">创建</button></div>
  </form>
</section>

<section class="card">
  <div class="card-head">
    <h2>任务列表</h2>
    <span class="meta">错过窗口默认跳过，不补跑</span>
  </div>
  <table class="table">
    <thead>
      <tr>
        <th>名称</th>
        <th>Cron</th>
        <th>时区</th>
        <th>状态</th>
        <th>上次派发</th>
        <th>下次执行</th>
        <th>运行数</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="schedule-rows">
      <tr><td colspan="8" class="meta">加载中…</td></tr>
    </tbody>
  </table>
</section>
{% endblock %}
